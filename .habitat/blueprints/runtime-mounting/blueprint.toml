schemaVersion = 1
id = "runtime-mounting"
version = 1

[[rules]]
id = "runtime_mounting_v1_imports"
lane = "enforced"
message = "Mounting consumes prepared process and native harness contracts, not upstream realization or observation implementations."
remediate = "Use definition, process-runtime and harnesses contracts; let terminal SDK composition supply the observation port."
[rules.runner]
name = "grit"
pattern = "runtime_mounting_v1_imports.md"
patternName = "runtime_mounting_v1_imports"
[rules.runner.acquisition]
kind = "check"
rootRoles = []
selections = []
rootPatterns = [{ rootRole = "project", patterns = ["src/**/*.ts"] }]

[[rules]]
id = "runtime_mounting_v1_structure"
lane = "enforced"
message = "The mounting owner preserves its package-less closed TypeScript boundary."
remediate = "Restore owner anchors and local TypeScript source and proof files without adding a package or nested owner."
[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []
[[instance.roots]]
id = "project"
required = true
kind = "directory"
