[[scopes]]
name = "api-service-root-model-leaves"
root = "plugins/server/api/*/src/service/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "open"
allowEmpty = true

[[scopes]]
name = "api-service-module-model-leaves"
root = "plugins/server/api/*/src/service/modules/*/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "open"
allowEmpty = true

[[scopes]]
name = "api-embedded-service-module-shells"
root = "plugins/server/api/*/src/service/modules/*"
kind = "directory"
mode = "closed"
required = [
  "AGENTS.md",
  "contract",
  "module.ts",
  "router",
