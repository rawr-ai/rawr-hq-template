name: Repository Ratchet

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: repository-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  required:
    name: Required lint, typecheck, and topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLICOLOR: "0"
      GRIT_DOWNLOADS_DISABLED: "true"
      GRIT_MAX_FILE_SIZE_BYTES: "0"
      HABITAT_COMMAND_TIMEOUT_MS: "600000"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*-v3.db
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock', 'nx.json', 'package.json', '**/package.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('bun.lock', 'nx.json', 'package.json', '**/package.json', '**/project.json') }}-
            nx-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify affected repository gates
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.sha }}
        run: bun run ci:affected

      - name: Verify full repository gates
        if: github.event_name != 'pull_request'
        run: bun run ci
