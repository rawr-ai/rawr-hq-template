schemaVersion = 2

[[scopes]]
name = "nx-plugin-project"
rootRole = "project"
relativePath = "."
kind = "directory"
mode = "closed"
required = [
  "habitat.toml",
  "project.json",
  "src",
  "tsconfig.json",
]
allowed = [
  "AGENTS.md",
  "test",
]

[[scopes]]
name = "nx-plugin-source"
rootRole = "project"
relativePath = "src"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.ts",
]
