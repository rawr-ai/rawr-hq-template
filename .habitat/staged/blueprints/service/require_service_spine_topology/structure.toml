[[scopes]]
name = "standalone-service-test-roots"
root = "services/*/test"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "@(behavior|integration|mechanics|support)",
]
allowed = [
  "behavior",
  "integration",
  "mechanics",
  "support",
]

