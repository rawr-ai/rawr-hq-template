]

[[scopes]]
name = "standalone-service-module-model-kind-indices"
root = "services/!(*.*)/src/service/modules/!(*.*)/model/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "index.ts",
]
allowed = [
  "*.ts",
