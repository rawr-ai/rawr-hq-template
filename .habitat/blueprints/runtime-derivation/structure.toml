schemaVersion = 2

[[scopes]]
name = "runtime-derivation-project"
rootRole = "project"
relativePath = "."
kind = "directory"
mode = "closed"
required = [
  "AGENTS.md",
  "habitat.toml",
  "project.json",
  "src",
  "test",
  "tsconfig.json",
  "tsconfig.test.json",
  "tsdown.config.ts",
]
allowed = []

[[scopes]]
name = "runtime-derivation-project-files"
rootRole = "project"
relativePath = "@(AGENTS.md|habitat.toml|project.json|tsconfig.json|tsconfig.test.json|tsdown.config.ts)"
kind = "file"
mode = "closed"

[[scopes]]
name = "runtime-derivation-source"
rootRole = "project"
relativePath = "src"
kind = "directory"
mode = "closed"
required = ["index.ts", "normalized-runtime-topology.ts"]
allowed = []

[[scopes]]
name = "runtime-derivation-source-files"
rootRole = "project"
relativePath = "src/*.ts"
kind = "file"
mode = "closed"

[[scopes]]
name = "runtime-derivation-proof"
rootRole = "project"
relativePath = "test"
kind = "directory"
mode = "closed"
required = ["normalized-topology.test.ts", "nx-cache.test.ts"]
allowed = []

[[scopes]]
name = "runtime-derivation-proof-files"
rootRole = "project"
relativePath = "test/*.test.ts"
kind = "file"
mode = "closed"
