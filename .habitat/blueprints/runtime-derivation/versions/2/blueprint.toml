schemaVersion = 1
id = "runtime-derivation"
version = 2

[[rules]]
id = "runtime_derivation_v2_structure"
lane = "enforced"
message = "The runtime derivation owner must preserve the exact complete-derivation source and proof closure."
remediate = "Restore the package-less runtime-derivation shell, twelve admitted source modules, and three owner-local proofs without adding optional interior, acquisition, execution, or lifecycle authority."

[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []

[[instance.roots]]
id = "project"
required = true
kind = "directory"
