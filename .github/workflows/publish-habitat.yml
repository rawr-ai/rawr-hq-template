name: Publish Habitat

on:
  pull_request:
    paths:
      - .habitat/blueprints/**
      - .github/workflows/publish-habitat.yml
      - apps/habitat/**
      - packages/habitat-sdk/**
      - packages/core/runtime/schema/**
      - resources/rule-evaluation/**
      - resources/source-inventory/**
      - services/habitat/**
      - bun.lock
      - nx.json
      - package.json
      - tsconfig.base.json
      - vitest.config.ts
  push:
    tags:
      - habitat-cli-v*

jobs:
  acceptance:
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeoutMinutes: 15
          - os: windows-latest
            timeoutMinutes: 25
    permissions:
      contents: read
    steps:
      - name: Enable Windows repository paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out exact candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Select the repository npm version
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify the installed SDK and CLI boundary
        env:
          CI: "1"
        run: >-
          bunx nx run @habitat-ai/cli:acceptance:oclif-installed-package
          --skip-nx-cache
          --outputStyle=static

  publish:
    name: Publish Nx release group
    if: startsWith(github.ref, 'refs/tags/habitat-cli-v')
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require canonical main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Match Habitat CLI tag
        run: >-
          test "$(jq -r .version
          apps/habitat/package.json
          packages/habitat-sdk/package.json
          | sort -u)"
          = "${GITHUB_REF_NAME#habitat-cli-v}"

      - name: Select npm OIDC publishing for Nx Release
        run: |
          npm install --global npm@12.0.2
          jq '.cli = ((.cli // {}) + {packageManager: "npm"})' nx.json > nx.publish.json
          mv nx.publish.json nx.json

      - name: Publish Habitat SDK and CLI
        run: >-
          npx nx release publish
          --outputStyle=static

      - name: Verify the registry release
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#habitat-cli-v}"
          for attempt in 1 2 3 4 5 6; do
            cli_version="$(npm view "@habitat-ai/cli@${release_version}" version 2>/dev/null || true)"
            sdk_version="$(npm view "@habitat-ai/sdk@${release_version}" version 2>/dev/null || true)"
            if [[ "${cli_version}" = "${release_version}" && "${sdk_version}" = "${release_version}" ]]; then
              break
            fi
            if [[ "${attempt}" = 6 ]]; then
              printf 'Habitat %s was not visible from the npm registry after %s attempts.\n' "${release_version}" "${attempt}" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          HABITAT_ACCEPTANCE_REGISTRY_VERSION="${release_version}" \
            bunx nx run @habitat-ai/cli:acceptance:oclif-installed-package \
            --skip-nx-cache \
            --outputStyle=static
