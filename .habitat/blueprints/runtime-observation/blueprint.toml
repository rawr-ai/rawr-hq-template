schemaVersion = 1
id = "runtime-observation"
version = 1

[[rules]]
id = "runtime_observation_v1_imports"
lane = "enforced"
message = "Observation consumes definition records and cannot import runtime control owners."
remediate = "Receive closed observation DTOs through the definition port; keep selection, acquisition, execution and mounting in their owners."
[rules.runner]
name = "grit"
pattern = "runtime_observation_v1_imports.md"
patternName = "runtime_observation_v1_imports"
[rules.runner.acquisition]
kind = "check"
rootRoles = []
selections = []
rootPatterns = [{ rootRole = "project", patterns = ["src/**/*.ts"] }]

[[rules]]
id = "runtime_observation_v1_structure"
lane = "enforced"
message = "Observation preserves its package-less closed TypeScript owner boundary."
remediate = "Restore required owner anchors and local TypeScript source and tests without a package or nested owner."
[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"
[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []
[[instance.roots]]
id = "project"
required = true
kind = "directory"
