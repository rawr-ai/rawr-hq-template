  "service",
]

[[scopes]]
name = "service-support-categories"
rootRole = "project"
relativePath = "test/support/@(db|service)"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.ts",
]
allowed = [
  "*.ts",
]
forbidden = [
  "*.spec.ts",
  "*.test.ts",
  "*.typecheck.ts",
