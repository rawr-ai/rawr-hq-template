allowed = []

[[scopes]]
name = "api-embedded-service-module-router-directories"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)/router"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "index.ts",
  "*.router.ts",
]
allowed = []

[[scopes]]
name = "standalone-service-middleware"
root = "services/*/src/service/middleware"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.middleware.ts",
