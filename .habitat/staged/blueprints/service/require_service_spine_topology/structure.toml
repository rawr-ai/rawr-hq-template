kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "entities",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "standalone-service-root-model-kinds"
root = "services/*/src/service/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "standalone-service-module-model-kinds"
root = "services/*/src/service/modules/*/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "api-service-root-model-kinds"
root = "plugins/server/api/*/src/service/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.ts"]
forbidden = ["index.ts"]

[[scopes]]
name = "api-service-module-model-kinds"
root = "plugins/server/api/*/src/service/modules/*/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = ["*.ts"]
forbidden = ["index.ts"]

