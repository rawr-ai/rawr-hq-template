name = "standalone-service-root-model-leaves"
root = "services/*/src/service/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "open"
allowEmpty = true

[[scopes]]
name = "standalone-service-module-model-leaves"
root = "services/*/src/service/modules/*/model/@(actors|dto|entities|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
