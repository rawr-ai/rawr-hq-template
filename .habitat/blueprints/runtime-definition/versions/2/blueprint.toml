schemaVersion = 1
id = "runtime-definition"
version = 2

[[rules]]
id = "runtime_definition_v2_structure"
lane = "enforced"
message = "The runtime definition owner must preserve the exact provider-plan authoring source and proof closure."
remediate = "Restore the package-less runtime-definition shell, eleven admitted source modules, and three owner-local proofs without adding optional interior, acquisition, execution, or lifecycle authority."

[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []

[[instance.roots]]
id = "project"
required = true
kind = "directory"
