name: Publish Habitat

on:
  push:
    tags:
      - habitat-blueprints-v*
      - habitat-cli-v*
      - rawr-cli-v*
      - typebox-adapter-v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Nx release group
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAWR_RELEASE_MANIFESTS: >-
        apps/cli/package.json
        packages/core/package.json
        packages/dev-node/package.json
        packages/hq-sdk/package.json
        plugins/cli/commands/chatgpt-corpus/package.json
        plugins/cli/commands/devops/package.json
        plugins/cli/commands/hyperresearch/package.json
        plugins/cli/commands/session-tools/package.json
        resources/agent-plugin-package-output/package.json
        resources/content-workspace/package.json
        resources/native-agent-provider/package.json
        resources/versioned-content/package.json
        services/agent-plugin-lifecycle/package.json
        services/chatgpt-corpus/package.json
        services/dev/package.json
        services/hq-ops/package.json
        services/hyperresearch-codex/package.json
        services/session-intelligence/package.json
    steps:
      - name: Check out tagged main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require canonical main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Match TypeBox adapter tag
        if: startsWith(github.ref, 'refs/tags/typebox-adapter-v')
        run: >-
          test "$(jq -r .version packages/typebox-adapter/package.json)"
          = "${GITHUB_REF_NAME#typebox-adapter-v}"

      - name: Match Habitat CLI tag
        if: startsWith(github.ref, 'refs/tags/habitat-cli-v')
        run: >-
          test "$(jq -r .version
          apps/habitat/package.json
          plugins/cli/commands/habitat/package.json
          resources/rule-evaluation/package.json
          resources/source-inventory/package.json
          services/habitat/package.json
          | sort -u)"
          = "${GITHUB_REF_NAME#habitat-cli-v}"

      - name: Match Habitat blueprints tag
        if: startsWith(github.ref, 'refs/tags/habitat-blueprints-v')
        run: >-
          test "$(jq -r .version packages/habitat-blueprints/package.json)"
          = "${GITHUB_REF_NAME#habitat-blueprints-v}"

      - name: Match RAWR CLI tag and release group
        if: startsWith(github.ref, 'refs/tags/rawr-cli-v')
        shell: bash
        run: |
          read -r -a manifests <<< "$RAWR_RELEASE_MANIFESTS"
          diff -u \
            <(jq -r '.release.groups["rawr-cli"].projects[]' nx.json | sort) \
            <(jq -r .name "${manifests[@]}" | sort)
          test "$(jq -r .version "${manifests[@]}" | sort -u)" \
            = "${GITHUB_REF_NAME#rawr-cli-v}"

      - name: Materialize Habitat npm manifests with Nx
        if: startsWith(github.ref, 'refs/tags/habitat-cli-v')
        run: |
          jq '
            .release.groups["habitat-cli"].version =
              ((.release.groups["habitat-cli"].version // {}) +
                {preserveLocalDependencyProtocols: false}) |
            .release.version =
              ((.release.version // {}) +
                {versionActionsOptions:
                  (((.release.version // {}).versionActionsOptions // {}) +
                    {skipLockFileUpdate: true})})
          ' nx.json > nx.publish.json
          mv nx.publish.json nx.json
          bunx nx release version "${GITHUB_REF_NAME#habitat-cli-v}" \
            --group=habitat-cli \
            --git-commit=false \
            --git-tag=false \
            --git-push=false \
            --stage-changes=false
          ! grep -n '"workspace:' \
            apps/habitat/package.json \
            plugins/cli/commands/habitat/package.json \
            resources/rule-evaluation/package.json \
            resources/source-inventory/package.json \
            services/habitat/package.json

      - name: Materialize RAWR npm manifests with Nx
        if: startsWith(github.ref, 'refs/tags/rawr-cli-v')
        shell: bash
        run: |
          jq '
            .release.groups["rawr-cli"].version =
              ((.release.groups["rawr-cli"].version // {}) +
                {preserveLocalDependencyProtocols: false}) |
            .release.version =
              ((.release.version // {}) +
                {versionActionsOptions:
                  (((.release.version // {}).versionActionsOptions // {}) +
                    {skipLockFileUpdate: true})})
          ' nx.json > nx.publish.json
          mv nx.publish.json nx.json
          bunx nx release version "${GITHUB_REF_NAME#rawr-cli-v}" \
            --group=rawr-cli \
            --git-commit=false \
            --git-tag=false \
            --git-push=false \
            --stage-changes=false
          read -r -a manifests <<< "$RAWR_RELEASE_MANIFESTS"
          ! grep -n '"workspace:' "${manifests[@]}"

      - name: Select npm OIDC publishing for Nx Release
        run: |
          npm install --global npm@12.0.2
          jq '.cli = ((.cli // {}) + {packageManager: "npm"})' nx.json > nx.publish.json
          mv nx.publish.json nx.json

      - name: Build TypeBox adapter
        if: startsWith(github.ref, 'refs/tags/typebox-adapter-v')
        run: >-
          bunx nx run @habitat-ai/typebox-adapter:build
          --outputStyle=static

      - name: Verify installed Habitat CLI
        if: startsWith(github.ref, 'refs/tags/habitat-cli-v')
        run: >-
          bunx nx run @habitat-ai/cli:acceptance:oclif-installed-package
          --outputStyle=static

      - name: Verify installed RAWR CLI
        if: startsWith(github.ref, 'refs/tags/rawr-cli-v')
        run: >-
          bunx nx run @habitat-ai/rawr:acceptance:oclif-installed-package
          --outputStyle=static

      - name: Verify native RAWR plugins
        if: startsWith(github.ref, 'refs/tags/rawr-cli-v')
        run: >-
          bunx nx run @habitat-ai/rawr:acceptance:oclif-native-plugins
          --outputStyle=static

      - name: Publish TypeBox adapter
        if: startsWith(github.ref, 'refs/tags/typebox-adapter-v')
        run: >-
          npx nx release publish
          --group=typebox-adapter
          --outputStyle=static

      - name: Publish Habitat CLI
        if: startsWith(github.ref, 'refs/tags/habitat-cli-v')
        run: >-
          npx nx release publish
          --group=habitat-cli
          --outputStyle=static

      - name: Publish RAWR CLI
        if: startsWith(github.ref, 'refs/tags/rawr-cli-v')
        run: >-
          npx nx release publish
          --group=rawr-cli
          --outputStyle=static

      - name: Publish Habitat blueprints
        if: startsWith(github.ref, 'refs/tags/habitat-blueprints-v')
        run: >-
          npx nx release publish
          --group=habitat-blueprints
          --outputStyle=static
