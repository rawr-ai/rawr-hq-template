schemaVersion = 1

[[scopes]]
name = "standalone-service-module-database-placement"
root = "services/!(*.*)/src/service/modules/!(*.*)/db"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = []

[[scopes]]
name = "api-service-root-database-placement"
root = "plugins/server/api/!(*.*)/src/service/db"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = []

[[scopes]]
name = "api-service-module-database-placement"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)/db"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = []

[[scopes]]
name = "standalone-service-databases"
root = "services/!(*.*)/src/service/db"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "migrations",
  "stores",
]
allowed = [
  "schema",
]

[[scopes]]
name = "standalone-service-database-migrations"
root = "services/!(*.*)/src/service/db/migrations"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.sql",
]
allowed = []

[[scopes]]
name = "standalone-service-database-schema"
root = "services/!(*.*)/src/service/db/schema"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.ts",
]
allowed = []
forbidden = [
  "index.ts",
  "generated.ts",
  "helpers.ts",
  "*.schema.ts",
  "*.generated.ts",
  "*.helper.ts",
  "*.helpers.ts",
]

[[scopes]]
name = "standalone-service-database-stores"
root = "services/!(*.*)/src/service/db/stores"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.ts",
]
allowed = []
forbidden = [
  "index.ts",
  "session.ts",
  "persistence.ts",
  "repository.ts",
  "provider.ts",
  "helpers.ts",
  "*.store.ts",
  "*.repository.ts",
  "*.reader.ts",
  "*.writer.ts",
  "*.session.ts",
  "*.persistence.ts",
  "*.provider.ts",
  "*.helper.ts",
  "*.helpers.ts",
]

[[scopes]]
name = "standalone-service-database-migration-leaves"
root = "services/!(*.*)/src/service/db/migrations/*.sql"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "standalone-service-database-schema-leaves"
root = "services/!(*.*)/src/service/db/schema/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "standalone-service-database-store-leaves"
root = "services/!(*.*)/src/service/db/stores/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true
