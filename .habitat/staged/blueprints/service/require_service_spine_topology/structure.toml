kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "@(*.test.ts|modules)",
]
allowed = [
  "*.test.ts",
  "modules",
]

[[scopes]]
name = "standalone-service-direct-behavior-suites"
root = "services/*/test/behavior/*.test.ts"
kind = "file"
mode = "open"
allowEmpty = true

[[scopes]]
name = "standalone-service-behavior-module-roots"
root = "services/*/test/behavior/modules"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*",
]
allowed = [
  "*",
]

[[scopes]]
name = "standalone-service-behavior-module-shells"
root = "services/*/test/behavior/modules/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.test.ts",
]
allowed = [
  "*.test.ts",
]

[[scopes]]
name = "standalone-service-behavior-module-suites"
root = "services/*/test/behavior/modules/*/*.test.ts"
kind = "file"
mode = "open"
