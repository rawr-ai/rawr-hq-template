schemaVersion = 1
id = "runtime-harnesses"
version = 2

[[rules]]
id = "runtime_harnesses_v2_imports"
lane = "enforced"
message = "Harness contracts and native hosts cannot acquire providers or own cross-harness mounting and observation orchestration."
remediate = "Consume already-lowered payloads and bounded process contracts; leave acquisition and cross-owner coordination in their owners."
[rules.runner]
name = "grit"
pattern = "runtime_harnesses_v2_imports.md"
patternName = "runtime_harnesses_v2_imports"
[rules.runner.acquisition]
kind = "check"
rootRoles = []
selections = []
rootPatterns = [{ rootRole = "project", patterns = ["elysia/**/*.ts", "src/**/*.ts"] }]

[[rules]]
id = "runtime_harnesses_v2_structure"
lane = "enforced"
message = "The native harness owner preserves its package-less closed TypeScript boundary."
remediate = "Restore owner anchors, contracts, admitted native host and owner-local proofs without a distributable package or nested owner."
[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []
[[instance.roots]]
id = "project"
required = true
kind = "directory"
