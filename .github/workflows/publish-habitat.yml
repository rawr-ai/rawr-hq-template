name: Windows workspace creation observation

on:
  pull_request:
    branches: [habitat-scoped-native-migration]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  scope:
    name: Verify diagnostic PR identity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source before scheduling Windows runners
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          jq -ce '
            .pull_request as $p |
            {
              repo: (.repository.full_name == "rawr-ai/rawr-hq-template"),
              sameRepo: ($p.head.repo.full_name == .repository.full_name),
              head: ($p.head.ref == "codex/habitat-windows-qualification-probe"),
              base: ($p.base.ref == "habitat-scoped-native-migration"),
              candidate: ($p.base.sha == "5df49bfcad419c7b331c517cc2781e87cafdf10f"),
              sourceOwner: ($p.user.login == "mateicanavra"),
              draft: ($p.draft == true)
            } | ., (all(.[]; . == true))
          ' "$GITHUB_EVENT_PATH"

  installed:
    needs: scope
    name: Workspace creation with the ordinary shared cache (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Preserve repository bytes and enable long paths
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the exact diagnostic commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Limit the probe to the diagnostic workflow and acceptance fixtures
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --quiet --no-ext-diff --no-renames "$BASE_SHA" HEAD -- . \
            ':(top,exclude,literal).github/workflows/publish-habitat.yml' \
            ':(top,exclude,literal)apps/habitat/test/installed-package.test.ts' \
            ':(top,exclude,literal)apps/habitat/test/support/spawn-installed-command.ts'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Select the repository npm version
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Record free space before the suite
        shell: pwsh
        run: |
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          "Workspace volume free (GiB): {0:N1}" -f ($drive.AvailableFreeSpace / 1GB)

      - name: Verify the installed SDK and CLI boundary
        shell: pwsh
        env:
          CI: "1"
          GRIT_TELEMETRY_DISABLED: "true"
          OPENSPEC_TELEMETRY: "0"
          HABITAT_PROBE_STDIN_EOF: "0"
          HABITAT_PROBE_BUN_CACHE_SCOPE: shared
        run: |
          if (Test-Path Env:HABITAT_ACCEPTANCE_REGISTRY_VERSION) {
            throw "The probe requires loopback candidate packages."
          }
          bunx nx run @habitat-ai/cli:acceptance:oclif-installed-package --skip-nx-cache --outputStyle=stream --reporter=verbose --testNamePattern=probe-workspace-prefix

      - name: Verify the two expected operations were selected in order
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $collection = bunx vitest list --project habitat-cli-installed-package-acceptance --json --testNamePattern=probe-workspace-prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = @(($collection -join "`n" | ConvertFrom-Json) | ForEach-Object { $_.name })
          $expected = @(
            'adopts the packed CLI into one bare Bun Nx repository through one native nx add [probe-workspace-prefix]'
            'creates the portable Bun repository before activating post-Git hooks [probe-workspace-prefix]'
          ) | ForEach-Object { "installed Habitat products > $_" }
          if (($actual -join "`n") -cne ($expected -join "`n")) { throw 'Vitest did not select only adoption and workspace creation in order.' }
          $actual

      - name: Record free space after the suite
        if: always()
        shell: pwsh
        run: |
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          "Workspace volume free (GiB): {0:N1}" -f ($drive.AvailableFreeSpace / 1GB)
