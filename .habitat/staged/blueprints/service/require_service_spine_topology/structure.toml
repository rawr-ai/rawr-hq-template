schemaVersion = 1

[[scopes]]
name = "standalone-service-packages"
root = "services/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "package.json",
  "project.json",
  "src",
  "tsconfig.json",
]
allowed = [
  "AGENTS.md",
  "test",
  "tsconfig.build.json",
  "tsconfig.test.json",
  "vitest.config.ts",
]

[[scopes]]
name = "standalone-service-public-faces"
root = "services/!(*.*)/src"
kind = "directory"
mode = "closed"
required = [
  "client.ts",
  "service",
]
allowed = []
forbidden = [
  "test",
  "tests",
  "__tests__",
]

[[scopes]]
name = "standalone-service-spines"
root = "services/*/src/service"
kind = "directory"
mode = "closed"
required = [
  "base.ts",
  "contract.ts",
  "impl.ts",
  "modules",
  "router.ts",
]
allowed = [
  "db",
  "middleware",
  "model",
]
forbidden = [
  "test",
  "tests",
  "__tests__",
]

[[scopes]]
name = "api-embedded-service-spines"
root = "plugins/server/api/*/src/service"
kind = "directory"
mode = "closed"
required = [
  "base.ts",
  "contract.ts",
  "impl.ts",
  "modules",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]
forbidden = [
  "test",
  "tests",
  "__tests__",
]

[[scopes]]
name = "standalone-service-root-middleware-interiors"
root = "services/*/src/service/middleware"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "[a-z]*([a-z0-9]|-[a-z0-9]).ts",
]
forbidden = [
  "index.ts",
  "*.middleware.ts",
]

[[scopes]]
name = "api-service-root-middleware-interiors"
root = "plugins/server/api/*/src/service/middleware"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "[a-z]*([a-z0-9]|-[a-z0-9]).ts",
]
forbidden = [
  "index.ts",
  "*.middleware.ts",
]

[[scopes]]
name = "standalone-service-module-shells"
root = "services/*/src/service/modules/*"
kind = "directory"
mode = "closed"
required = [
  "AGENTS.md",
  "contract",
  "module.ts",
  "router",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]
forbidden = [
  "test",
  "tests",
  "__tests__",
]

[[scopes]]
name = "standalone-service-module-contract-interiors"
root = "services/*/src/service/modules/*/contract"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.ts",
]

[[scopes]]
name = "standalone-service-module-router-interiors"
root = "services/*/src/service/modules/*/router"
kind = "directory"
mode = "closed"
required = [
  "*.router.ts",
]
allowed = []

[[scopes]]
name = "standalone-service-module-middleware-interiors"
root = "services/*/src/service/modules/*/middleware"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.ts",
]

[[scopes]]
name = "api-service-module-contract-interiors"
root = "plugins/server/api/*/src/service/modules/*/contract"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.ts",
]

[[scopes]]
name = "api-service-module-router-interiors"
root = "plugins/server/api/*/src/service/modules/*/router"
kind = "directory"
mode = "closed"
required = [
  "*.router.ts",
]
allowed = []

[[scopes]]
name = "api-service-module-middleware-interiors"
root = "plugins/server/api/*/src/service/modules/*/middleware"
kind = "directory"
mode = "closed"
required = [
  "index.ts",
]
allowed = [
  "*.ts",
]

[[scopes]]
name = "standalone-service-source-test-directory-sentinel"
root = "services/*/src/**/@(test|tests|__tests__)"
kind = "file"
mode = "open"
allowEmpty = true

[[scopes]]
name = "standalone-service-source-suite-file-sentinel"
root = "services/*/src/**/*.@(test|spec).ts"
kind = "directory"
mode = "open"
allowEmpty = true

[[scopes]]
name = "standalone-service-root-models"
root = "services/*/src/service/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "entities",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "standalone-service-module-models"
root = "services/*/src/service/modules/*/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "entities",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "api-service-root-models"
