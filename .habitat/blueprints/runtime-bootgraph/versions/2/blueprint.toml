schemaVersion = 1
id = "runtime-bootgraph"
version = 2

[[rules]]
id = "runtime_bootgraph_v2_structure"
lane = "enforced"
message = "The runtime-bootgraph owner must preserve its private project boundary and closed TypeScript source and proof grammar."
remediate = "Restore the package-less project anchors, sole source entry, and owner-local TypeScript source and tests without adding a nested owner, package, public face, or live-runtime authority."

[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []

[[instance.roots]]
id = "project"
required = true
kind = "directory"
