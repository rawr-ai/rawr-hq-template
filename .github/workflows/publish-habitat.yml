name: Publish Habitat

on:
  push:
    tags:
      - habitat-cli-v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Nx release group
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require canonical main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Match Habitat CLI tag
        run: >-
          test "$(jq -r .version
          apps/habitat/package.json
          packages/habitat-sdk/package.json
          | sort -u)"
          = "${GITHUB_REF_NAME#habitat-cli-v}"

      - name: Select npm OIDC publishing for Nx Release
        run: |
          npm install --global npm@12.0.2
          jq '.cli = ((.cli // {}) + {packageManager: "npm"})' nx.json > nx.publish.json
          mv nx.publish.json nx.json

      - name: Publish Habitat SDK and CLI
        run: >-
          npx nx release publish
          --group=habitat-cli
          --outputStyle=static

      - name: Verify the registry release
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#habitat-cli-v}"
          consumer_root="${RUNNER_TEMP}/habitat-registry-consumer"
          mkdir -p "${consumer_root}"
          cd "${consumer_root}"
          npm init --yes >/dev/null
          npm install --no-audit --no-fund "@habitat-ai/cli@${release_version}" "nx@23.1.0"
          test "$(node -p "require('./node_modules/@habitat-ai/sdk/package.json').version")" = "${release_version}"
          ./node_modules/.bin/habitat --help >/dev/null
