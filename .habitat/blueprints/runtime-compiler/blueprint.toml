schemaVersion = 1
id = "runtime-compiler"
version = 1

[[rules]]
id = "runtime_compiler_v1_structure"
lane = "enforced"
message = "The runtime compiler owner must preserve the exact private compilation source and proof closure."
remediate = "Restore the package-less runtime-compiler shell, four admitted source modules, and three owner-local proofs without adding optional interior, publication, execution, or lifecycle authority."

[rules.runner]
name = "habitat"
mode = "structure"
structure = "structure.toml"

[instance]
manifest = "habitat.toml"
anchorRoot = "project"
selections = []

[[instance.roots]]
id = "project"
required = true
kind = "directory"
