[[scopes]]
name = "service-support-module-shells"
rootRole = "project"
relativePath = "test/support/modules/*"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.ts",
]
allowed = [
  "*.ts",
]
forbidden = [
