schemaVersion = 1

[[scopes]]
name = "standalone-service-packages"
root = "services/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "package.json",
  "project.json",
  "src",
  "tsconfig.json",
]
allowed = [
  "AGENTS.md",
  "test",
  "tsconfig.build.json",
  "tsconfig.test.json",
  "vitest.config.ts",
]

[[scopes]]
name = "standalone-service-public-faces"
root = "services/!(*.*)/src"
kind = "directory"
mode = "closed"
required = [
  "client.ts",
  "service",
]
allowed = []

[[scopes]]
name = "standalone-service-spines"
root = "services/*/src/service"
kind = "directory"
mode = "closed"
required = [
  "base.ts",
  "contract.ts",
  "impl.ts",
  "modules",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]

[[scopes]]
name = "api-embedded-service-spines"
root = "plugins/server/api/*/src/service"
kind = "directory"
mode = "closed"
required = [
  "base.ts",
  "contract.ts",
  "impl.ts",
  "modules",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]

[[scopes]]
name = "standalone-service-module-namespaces"
root = "services/!(*.*)/src/service/modules"
kind = "directory"
mode = "closed"
allowed = [
  "[a-z]*([a-z0-9])*(-[a-z]*([a-z0-9]))",
]

[[scopes]]
name = "api-embedded-service-module-namespaces"
root = "plugins/server/api/!(*.*)/src/service/modules"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "[a-z]*([a-z0-9])*(-[a-z]*([a-z0-9]))",
]

[[scopes]]
name = "standalone-service-module-shells"
root = "services/!(*.*)/src/service/modules/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "AGENTS.md",
  "contract.ts",
  "module.ts",
  "router",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]

[[scopes]]
name = "api-embedded-service-module-shells"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)"
kind = "directory"
mode = "closed"
required = [
  "AGENTS.md",
  "contract.ts",
  "module.ts",
  "router",
  "router.ts",
]
allowed = [
  "middleware",
  "model",
]

[[scopes]]
name = "standalone-service-root-models"
root = "services/*/src/service/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "api-service-root-models"
root = "plugins/server/api/*/src/service/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "standalone-service-module-models"
root = "services/!(*.*)/src/service/modules/!(*.*)/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "api-service-module-models"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)/model"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "actors",
  "dto",
  "errors",
  "helpers",
  "policy",
  "ports",
  "prompts",
]

[[scopes]]
name = "standalone-service-root-model-kinds"
root = "services/*/src/service/model/@(actors|dto|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

[[scopes]]
name = "standalone-service-module-model-kinds"
root = "services/!(*.*)/src/service/modules/!(*.*)/model/@(actors|dto|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

[[scopes]]
name = "api-service-root-model-kinds"
root = "plugins/server/api/*/src/service/model/@(actors|dto|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

[[scopes]]
name = "api-service-module-model-kinds"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)/model/@(actors|dto|errors|helpers|policy|ports|prompts)"
kind = "directory"
mode = "closed"
allowEmpty = true
allowed = [
  "*.ts",
]
forbidden = [
  "index.ts",
]

[[scopes]]
name = "standalone-service-root-model-leaves"
root = "services/*/src/service/model/@(actors|dto|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "standalone-service-module-model-leaves"
root = "services/!(*.*)/src/service/modules/!(*.*)/model/@(actors|dto|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "api-service-root-model-leaves"
root = "plugins/server/api/*/src/service/model/@(actors|dto|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "api-service-module-model-leaves"
root = "plugins/server/api/!(*.*)/src/service/modules/!(*.*)/model/@(actors|dto|errors|helpers|policy|ports|prompts)/*.ts"
kind = "file"
mode = "closed"
allowEmpty = true

[[scopes]]
name = "standalone-service-module-router-directories"
root = "services/!(*.*)/src/service/modules/!(*.*)/router"
kind = "directory"
mode = "closed"
allowEmpty = true
required = [
  "*.router.ts",
